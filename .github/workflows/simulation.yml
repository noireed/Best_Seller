name: AQuA simulation
run-name: "AQuA ${{ inputs.session && 'continuous session' || github.event_name == 'schedule' && 'scheduled run' || 'manual check' }}"
on:
  push:
    branches: [fix/cloud-research]
    paths: [.github/workflows/simulation.yml, app/cloud_cycle.py, app/cloud_session.py, tests/test_cloud_session.py]
  schedule:
    - cron: '17 20 * * 0-4'
    - cron: '17 23 * * 0-4'
    - cron: '7,22,37,52 0-5 * * 1-5'
    - cron: '47 23 * * 0-4'
    - cron: '3 3 * * 1-5'
  workflow_dispatch:
    inputs:
      recovery_sha:
        description: Blob SHA of the interrupted first cycle to reconcile
        type: string
        default: ''
      research:
        description: Refresh company news and disclosures
        type: boolean
        default: false
      session_minutes:
        description: Runner session length (11-330 minutes); successor uses 330
        type: number
        default: 330
      session:
        description: Maintain cloud standby and check every 15 minutes during market hours
        type: boolean
        default: false
      trade:
        description: Submit simulation orders during the trading window
        type: boolean
        default: false

# Continuous runs retain a queued successor independently of the order lock.
concurrency:
  group: ${{ (inputs.session || (github.event_name == 'schedule' && github.event.schedule != '47 23 * * 0-4' && github.event.schedule != '3 3 * * 1-5')) && 'aqua-team-5-session' || format('aqua-run-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  GEMINI_BACKEND: developer
  GEMINI_DAILY_BUDGET: '100'
  GEMINI_REVIEWS_PER_CYCLE: '8'
  GEMINI_MIN_INTERVAL_SECONDS: '12'
  GEMINI_PROJECT: best-seller-514603
  GEMINI_REQUIRED_FOR_BUY: 'true'
  PROTECT_SELL_SIGNAL: 'true'

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'schedule' && !inputs.trade && !inputs.research && !inputs.recovery_sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt 'cryptography>=44,<49'
      - run: python -m pytest -q
      - run: python -m app.cloud_cycle
        env:
          TEAM_CODE: ${{ secrets.AQUA_TEAM_CODE }}
          CLOUD_PROBE: '1'
          GEMINI_API_KEY: ${{ secrets.AQUA_GEMINI_API_KEY }}
          AQUA_STATE_KEY: ${{ secrets.AQUA_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}

  trade:
    if: github.ref == 'refs/heads/main' && (github.event.schedule == '7,22,37,52 0-5 * * 1-5' || github.event.schedule == '17 20 * * 0-4' || github.event.schedule == '17 23 * * 0-4' || inputs.trade || inputs.recovery_sha)
    runs-on: ubuntu-latest
    concurrency:
      group: aqua-team-5-orders
      cancel-in-progress: false
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reserve continuous successor
        if: ${{ !inputs.recovery_sha && (github.event_name == 'schedule' || inputs.session) }}
        run: python3 -m app.cloud_continuation
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt 'cryptography>=44,<49'
      - run: python -u -m app.cloud_session
        env:
          CLOUD_SESSION: ${{ !inputs.recovery_sha && (github.event_name == 'schedule' || inputs.session) }}
          CLOUD_CONTINUATION_RESERVED: ${{ !inputs.recovery_sha && (github.event_name == 'schedule' || inputs.session) }}
          CLOUD_SESSION_MINUTES: ${{ inputs.session_minutes || 330 }}
          TEAM_CODE: ${{ secrets.AQUA_TEAM_CODE }}
          GNEWS_API_KEY: ${{ secrets.AQUA_GNEWS_API_KEY }}
          DART_API_KEY: ${{ secrets.AQUA_DART_API_KEY }}
          AQUA_STATE_KEY: ${{ secrets.AQUA_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.AQUA_GEMINI_API_KEY }}
          RECOVERY_SHA: ${{ inputs.recovery_sha }}

  research:
    if: github.event.schedule == '47 23 * * 0-4' || github.event.schedule == '3 3 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.research && !inputs.trade)
    concurrency:
      group: aqua-team-5-research
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt 'cryptography>=44,<49'
      - run: python -m app.cloud_cycle
        env:
          CLOUD_RESEARCH: '1'
          GNEWS_API_KEY: ${{ secrets.AQUA_GNEWS_API_KEY }}
          DART_API_KEY: ${{ secrets.AQUA_DART_API_KEY }}
          AQUA_STATE_KEY: ${{ secrets.AQUA_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
