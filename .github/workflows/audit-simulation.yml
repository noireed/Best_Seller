name: AQuA trading audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt 'cryptography>=44,<49'
      - run: python -m pytest tests/test_grounded_review.py tests/test_cloud_audit.py tests/test_cloud_recovery.py tests/test_cloud_session.py tests/test_dart.py tests/test_free_research.py -q
      - run: python -m app.cloud_audit
        env:
          GH_TOKEN: ${{ github.token }}
          AQUA_STATE_KEY: ${{ secrets.AQUA_STATE_KEY }}
