name: AQuA automatic recovery
on:
  workflow_run:
    workflows: [AQuA simulation]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: aqua-team-5-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt 'cryptography>=44,<49'
      - run: python -m app.cloud_watchdog
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
